# -------------------------------
# Nginx
# -------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-nginx-dep
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicasCount.nginx }}
  selector:
    matchLabels:
      app: nginx-dep-pod
  template:
    metadata:
      labels:
        app: nginx-dep-pod
    spec:
      containers:
      - name: nginx
        image: {{ .Values.images.nginx.name }}:{{ .Values.images.nginx.tag }}
        ports:
        - containerPort: 443
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: tls-certs
          mountPath: /etc/nginx/certs/
          readOnly: true
        resources:
              requests:
                memory: "64Mi"
                cpu: "250m"
              limits:
                memory: "128Mi"
                cpu: "500m"
      volumes:
      - name: nginx-config
        configMap:
          name: custom-nginx-config
      - name: tls-certs
        secret:
          secretName: secret-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-nginx-config
  namespace: {{ .Release.Namespace }}
data:
  default.conf: |
    server {
            listen 443 ssl;
            server_name localhost;

            ssl_certificate /etc/nginx/certs/tls.crt;
            ssl_certificate_key /etc/nginx/certs/tls.key;


            ssl_session_cache    shared:SSL:1m;
            ssl_session_timeout  5m;
            location / {
                proxy_pass http://{{ .Release.Name }}-go-app-svc; # your backend API
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: nginx-dep-pod
  ports:
    - name: https-proxy
      protocol: TCP
      port: 443
      targetPort: 443